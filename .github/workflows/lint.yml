name: Lint code

on:
  push:
    branches:
      - '**' 
  pull_request:
    branches:
      - UI-Sprint  

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install npm dependencies
        run: npm install

      - name: Lint code
        run: npm run lint
      - name: Checkout branch
        run: git checkout $GITHUB_REF || git checkout -b temporary-branch
    
      - name: Auto-commit fixes
        uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actions
          add: "['src/']"
          message: "Fix linting"
